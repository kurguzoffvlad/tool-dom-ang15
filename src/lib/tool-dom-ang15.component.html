<div class="playground">

  <header class="playground__header">
    <h1>DOM Playground</h1>
    <p>Демонстрация всех методов <code>DomClass</code>, <code>DomElement</code>, <code>DomStyle</code></p>
  </header>

  <main class="playground__body">

    <!-- ЛЕВАЯ КОЛОНКА: элементы и кнопки -->
    <section class="playground__panel">

      <!-- Песочница — корень для addClassMarginPadding -->
      <div #sandbox class="sandbox">
        <h2>Песочница</h2>

        <!-- Целевой элемент для классов и стилей -->
        <div #target class="target">
          🎯 target — применяем классы и стили
        </div>

        <!-- Контейнер для динамически создаваемых элементов -->
        <div #dynamicHost class="dynamic-host">
          <span>динамические элементы ↓</span>
        </div>
      </div>

      <!-- Кнопки: DomElement -->
      <div class="group">
        <h3>DomElement</h3>
        <div class="group__btns">
          <button (click)="demoCreateElement()">createElement</button>
          <button (click)="demoElementCreate()">elementCreate</button>
          <button (click)="demoElementAdd()">elementAdd</button>
          <button (click)="demoElementRemove()">elementRemove</button>
          <button (click)="demoElementGet()">elementGet</button>
          <button (click)="demoGetByDataAttr()">getElementByDataAttribute</button>
          <button (click)="demoGetCoordinates()">getCoordinates</button>
          <button (click)="demoGetParent()">elementGetParent</button>
          <button (click)="demoSiblingsAll()">elementsGetSiblingAll</button>
          <button (click)="demoSiblingsNext()">elementGetSiblingNext</button>
          <button (click)="demoSiblingsPrevious()">elementGetSiblingPrevious</button>
          <button (click)="demoGetChildren()">elementGetChildren</button>
        </div>
      </div>

      <!-- Кнопки: DomClass -->
      <div class="group">
        <h3>DomClass</h3>
        <div class="group__btns">
          <button (click)="demoHasClass()">hasClass</button>
          <button (click)="demoAddClass()">addClass</button>
          <button (click)="demoAddClasses()">addClasses</button>
          <button (click)="demoAddClassMarginPadding()">addClassMarginPadding</button>
          <button (click)="demoDeleteClassMarginPadding()">deleteClassMarginPadding</button>
          <button (click)="demoRemoveClass()">removeClass</button>
          <button (click)="demoToggleClass()">toggleClass</button>
          <button (click)="demoToggleForce()">toggleClass(force=true)</button>
          <button (click)="demoGetClasses()">getClasses</button>
          <button (click)="demoClearClasses()">clearClasses</button>
        </div>
      </div>

      <!-- Кнопки: DomStyle -->
      <div class="group">
        <h3>DomStyle</h3>
        <div class="group__btns">
          <button (click)="demoApplyStyle()">applyStyleProperty</button>
          <button (click)="demoGetStyle()">getStyle</button>
          <button (click)="demoRemoveStyle()">removeStyle</button>
        </div>
      </div>

      <div class="group">
        <div class="group__btns">
          <button class="btn-reset" (click)="resetAll()">🧹 Reset All</button>
          <button class="btn-clear" (click)="clearLog()">Clear Log</button>
        </div>
      </div>

    </section>

    <!-- ПРАВАЯ КОЛОНКА: лог -->
    <aside class="playground__log">
      <h2>Лог операций</h2>
      <ul>
        <li *ngFor="let item of logHtml">{{ item }}</li>
      </ul>
      <p *ngIf="!logHtml.length" class="empty">Пока пусто — жми кнопки слева.</p>
    </aside>

  </main>
</div>
